<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VOICEVOX リーダー</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./background-speech.js"></script>
    <script type="module" src="./renderer.mjs"></script>
</head>
<body>
    <main>
        <header>
            <h1><span class="sound-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>VOICEVOX リーダー</h1>
            <div class="engine">
                <span id="connection">接続を確認中…</span>
                <button type="button" id="reconnect" aria-disabled="true" aria-describedby="connection">再接続</button>
            </div>
        </header>
        <section class="editor" aria-labelledby="text-label">
            <label id="text-label" for="text">本文</label>
            <textarea id="text" aria-errormessage="status" placeholder="読み上げたい文章を入力、または貼り付けてください。" autofocus autocomplete="off" spellcheck="false"></textarea>
        </section>
        <fieldset>
            <legend>読み上げ設定</legend>
            <div class="fields">
                <label>話者<select id="speaker" disabled></select></label>
                <label>スタイル<select id="style" disabled></select></label>
                <label>話速（倍）<input id="speed" type="number" min="0.5" max="2" step="0.05" value="1" required disabled></label>
                <label>音量（％）<input id="volume" type="number" min="0" max="200" step="1" value="100" required disabled></label>
            </div>
            <details id="voice-details">
                <summary id="voice-details-summary">声の詳細設定</summary>
                <div class="fields voice-fields">
                    <label>声の高さ<input id="pitch" type="number" min="-0.15" max="0.15" step="0.01" value="0" required disabled></label>
                    <label>抑揚<input id="intonation" type="number" min="0" max="2" step="0.1" value="1" required disabled></label>
                    <label>間の長さ（倍）<input id="pause" type="number" min="0" max="2" step="0.1" value="1" required disabled></label>
                </div>
            </details>
            <span id="settings-notice" role="status"></span>
        </fieldset>
        <footer>
            <div class="actions">
                <button type="button" id="read" aria-keyshortcuts="Control+Enter" aria-disabled="true">読み上げ<kbd aria-hidden="true">Ctrl+Enter</kbd></button>
                <button type="button" id="stop" aria-keyshortcuts="Escape" aria-disabled="true">停止<kbd aria-hidden="true">Esc</kbd></button>
            </div>
            <span id="status" data-state="stopped">停止</span>
            <span id="announcement" class="visually-hidden" role="status" aria-atomic="true"></span>
        </footer>
    </main>
</body>
</html>
