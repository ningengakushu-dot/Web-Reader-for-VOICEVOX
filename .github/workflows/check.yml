# 拡張機能が壊れた状態で main に入るのを防ぐ最小限の検査。
# OCR・読み上げの精度検証はブラウザ実機が必要なため CI では行わない（手元で実施する）。
name: check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: JavaScript の構文チェック
        run: |
          for f in *.js; do
            node --check "$f"
            echo "OK  $f"
          done
          for f in tests/*.js; do
            node --check "$f"
            echo "OK  $f"
          done
          for f in tools/*.mjs; do
            node --check "$f"
            echo "OK  $f"
          done

      - name: 読み上げ精度と負荷制御の回帰検査
        run: node tools/test-reading-performance.mjs

      - name: OCR画像証拠の多数一致融合検査
        run: node tests/ocr-consensus-fusion.test.js

      - name: OCRモデルとLSTM専用コアの互換性検査
        run: node tests/tessdata-compatibility.test.js

      - name: アップデートお知らせ機能の単体・結合検査
        run: node tests/update-notice.test.js

      - name: 拡張コンテキスト無効化の回帰検査
        run: node tests/context-invalidation.test.js

      - name: メッセージ境界と入力検証の回帰検査
        run: node tests/security-boundary.test.js

      - name: コンテンツのプライバシー境界検査
        run: node tests/content-privacy.test.js

      - name: 設定値とアイコン表示の安全性検査
        run: node tests/options-safety.test.js

      - name: バックグラウンド失敗伝播の回帰検査
        run: node tests/background-robustness.test.js

      - name: 複数タブ音声要求の直列化検査
        run: node tests/background-concurrency.test.js

      - name: 音声再生終了状態の回帰検査
        run: node tests/offscreen-playback.test.js

      - name: OCR要求キュー上限の回帰検査
        run: node tests/offscreen-queue.test.js

      - name: VOICEVOX応答サイズ・タイムアウト検査
        run: node tests/response-limits.test.js

      - name: 静的セキュリティ監査
        run: node tools/security-audit.mjs

      - name: manifest.json の妥当性と参照ファイルの存在確認
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const refs = [
              m.background.service_worker,
              m.options_page,
              ...Object.values(m.icons),
              ...m.content_scripts.flatMap((c) => c.js),
              ...(m.web_accessible_resources || []).flatMap((w) => w.resources || []),
            ];
            let ng = 0;
            for (const r of refs) {
              if (!fs.existsSync(r)) { console.error("参照先が無い: " + r); ng++; }
            }
            if (m.manifest_version !== 3) { console.error("MV3 ではない"); ng++; }
            if (!/^\d+\.\d+\.\d+$/.test(m.version)) { console.error("version の形式が不正"); ng++; }
            if (ng) process.exit(1);
            console.log("manifest OK (v" + m.version + ")");
          '

      - name: 拡張機能ページが読み込むファイルの存在確認
        run: |
          # script/link の参照先が実在するか。JSファイルを分割したときに
          # HTML への追記漏れで拡張が壊れるのを防ぐ。
          node -e '
            const fs = require("fs");
            const pages = ["offscreen.html", "options.html", "capture.html"];
            let ng = 0;
            for (const page of pages) {
              const html = fs.readFileSync(page, "utf8");
              for (const m of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
                const ref = m[1];
                if (/^(https?:|data:|#)/.test(ref)) continue;
                if (!fs.existsSync(ref)) { console.error(page + " の参照先が無い: " + ref); ng++; }
              }
            }
            if (ng) process.exit(1);
            console.log("拡張機能ページの参照 OK");
          '

      - name: ページ内でトップレベル宣言が衝突しないことの確認
        run: |
          # 同じページに読み込むスクリプトを連結して構文検査する。
          # 別ファイルでも同じ const を宣言すると実行時に SyntaxError で
          # ページ全体が動かなくなるため、CI で先に検出する。
          node -e '
            const fs = require("fs"), cp = require("child_process");
            let ng = 0;
            for (const page of ["offscreen.html", "capture.html", "options.html"]) {
              const html = fs.readFileSync(page, "utf8");
              const srcs = [...html.matchAll(/<script src="([^"]+)"/g)]
                .map((m) => m[1]).filter((s) => !s.startsWith("vendor/"));
              fs.writeFileSync(".tmp-merge.js", srcs.map((s) => fs.readFileSync(s, "utf8")).join("\n;\n"));
              try {
                cp.execSync("node --check .tmp-merge.js", { stdio: "pipe" });
                console.log("OK  " + page);
              } catch (e) {
                console.error("NG  " + page + "\n" + e.stderr.toString());
                ng++;
              }
            }
            fs.unlinkSync(".tmp-merge.js");
            process.exit(ng ? 1 : 0);
          '

      - name: リモートコードを実行していないことの確認
        run: |
          # importScripts は同梱ファイルの読み込みに使うため、外部URLの場合だけを弾く。
          if grep -rnE '\beval\(|new Function\(|importScripts\(["'"'"']https?:' \
              --include=*.js --include=*.html . \
              | grep -v '^./vendor/'; then
            echo "リモートコード実行に該当し得る記述があります（ストア審査で不可）"
            exit 1
          fi
          echo "OK  該当なし"

      - name: 提出用パッケージに含めるファイルが揃っているか
        run: |
          missing=0
          for f in $(grep -oE "'[A-Za-z0-9_.-]+'" tools/pack.ps1 \
                     | tr -d "'" | grep -E '\.(js|html|css|json|txt|md)$|^LICENSE'); do
            [ -e "$f" ] || { echo "同梱対象が無い: $f"; missing=1; }
          done
          [ -d vendor ] || { echo "vendor/ が無い"; missing=1; }
          exit $missing
