name: apply-notice-threshold

on:
  push:
    branches:
      - release/1.4.3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/1.4.3
          fetch-depth: 0

      - name: Apply corrected update notice threshold
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bg = Path('background.js')
          source = bg.read_text(encoding='utf-8')
          old = 'const UPDATE_NOTICE_INTRODUCED_VERSION = "1.4.1";'
          new = 'const UPDATE_NOTICE_INTRODUCED_VERSION = "1.4.3";'
          if source.count(old) != 1:
              raise SystemExit('background.js の更新通知バージョンが一意に見つかりません')
          bg.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/update-notice.test.js')
          test = test_path.read_text(encoding='utf-8')
          replacements = {
              '// 1.4.1以降の修正版では同じ案内を再登録しない': '// 1.4.3以降の修正版では同じ案内を再登録しない',
              'previousVersion: "1.4.1"': 'previousVersion: "1.4.3"',
              '1.4.1以降からの更新では通知フラグを再設定しないこと': '1.4.3以降からの更新では通知フラグを再設定しないこと'
          }
          for old_text, new_text in replacements.items():
              if old_text not in test:
                  raise SystemExit(f'テスト更新対象が見つかりません: {old_text}')
              test = test.replace(old_text, new_text, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          node tests/update-notice.test.js

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-notice-threshold.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js tests/update-notice.test.js
          git add -u .github/workflows/apply-notice-threshold.yml
          git diff --cached --check
          git commit -m "fix: v1.4.3で修正済み更新案内を再表示"
          git push origin HEAD:release/1.4.3
