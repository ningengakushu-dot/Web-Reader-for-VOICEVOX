name: apply-update-notice-143

on:
  push:
    branches:
      - release/1.4.3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/1.4.3
          fetch-depth: 0

      - name: Make the corrected notice appear on the 1.4.3 update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          background = Path('background.js')
          source = background.read_text(encoding='utf-8')
          old = 'const UPDATE_NOTICE_INTRODUCED_VERSION = "1.4.1";'
          new = 'const UPDATE_NOTICE_INTRODUCED_VERSION = "1.4.3";'
          if source.count(old) != 1:
              raise SystemExit('更新通知バージョンの対象が一意に見つかりません')
          background.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/update-notice.test.js')
          test = test_path.read_text(encoding='utf-8')
          old_block = '''        // 1.4.1以降の修正版では同じ案内を再登録しない
          bgChromeMock.storage.local.data.update_notice_pending = false;
          bgContext.__onInstalledListener({ reason: "update", previousVersion: "1.4.1" });
          await new Promise((resolve) => setImmediate(resolve));
          assert.strictEqual(bgChromeMock.storage.local.data.update_notice_pending, false,
              '1.4.1以降からの更新では通知フラグを再設定しないこと');
          console.log(' -> PASSED: 修正版への更新では同じ案内を再表示しない');

          // claim テスト用に、旧版からの更新後と同じ状態へ戻す
          bgChromeMock.storage.local.data.update_notice_pending = true;
'''
          new_block = '''        // 1.4.2から1.4.3への更新では、修正済みの案内を一度表示する
          bgChromeMock.storage.local.data.update_notice_pending = false;
          bgContext.__onInstalledListener({ reason: "update", previousVersion: "1.4.2" });
          await new Promise((resolve) => setImmediate(resolve));
          assert.strictEqual(bgChromeMock.storage.local.data.update_notice_pending, true,
              '1.4.2からの更新では修正済み通知を表示対象にすること');
          console.log(' -> PASSED: v1.4.2からのupdateでは修正済み通知を表示する');

          // 1.4.3以降の修正版では同じ案内を再登録しない
          bgChromeMock.storage.local.data.update_notice_pending = false;
          bgContext.__onInstalledListener({ reason: "update", previousVersion: "1.4.3" });
          await new Promise((resolve) => setImmediate(resolve));
          assert.strictEqual(bgChromeMock.storage.local.data.update_notice_pending, false,
              '1.4.3以降からの更新では通知フラグを再設定しないこと');
          console.log(' -> PASSED: v1.4.3以降では同じ案内を再表示しない');

          // claim テスト用に、旧版からの更新後と同じ状態へ戻す
          bgChromeMock.storage.local.data.update_notice_pending = true;
'''
          if old_block not in test:
              raise SystemExit('更新通知テストの対象が見つかりません')
          test_path.write_text(test.replace(old_block, new_block, 1), encoding='utf-8')
          PY

          node tests/update-notice.test.js

      - name: Commit the release-candidate adjustment
        shell: bash
        run: |
          rm .github/workflows/apply-update-notice-143.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js tests/update-notice.test.js
          git add -u .github/workflows/apply-update-notice-143.yml
          git diff --cached --check
          git commit -m "fix: v1.4.3更新時に修正済み通知を表示"
          git push origin HEAD:release/1.4.3
