name: finalize-audit

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  security-events: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: audit/full-codebase
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Reconstruct audited patch
        shell: bash
        run: |
          cat .audit-patch2/part00 .audit-patch2/part01 .audit-patch2/part02 .audit-patch2/part03 \
              .audit-patch2/part04 .audit-patch2/part05 .audit-patch2/part06 .audit-patch2/part07 \
              > /tmp/audit.patch.xz.b64
          echo "8cf2a8ec06dd4d4c377a86ebd72fba39802886fa3fc7a5a3e17e32281bb507e3  /tmp/audit.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/audit.patch.xz.b64 > /tmp/audit.patch.xz
          echo "0a137b078019182d0a8cdf7c13953e39e9ad13e113949b84bf4e1e2aef97f312  /tmp/audit.patch.xz" | sha256sum -c -
          xz -dc /tmp/audit.patch.xz > /tmp/audit.patch
          echo "6f058cdff6d3523902df6c1dadfe942a9e71a2c7ad65636213cbb045595fc5cf  /tmp/audit.patch" | sha256sum -c -

      - name: Build clean final tree
        shell: bash
        run: |
          git reset --hard 1472cc49db030043c5961ed8b209ae263b87ddb9
          git clean -fdx
          git apply --check /tmp/audit.patch
          git apply /tmp/audit.patch

          # 安全なレスポンス読取関数を追加したため、性能テストのVMにも同等の模擬関数を渡す。
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/test-reading-performance.mjs')
          source = path.read_text()
          old = '''        VOICEVOX_SYNTHESIS_TIMEOUT_MS: 60000,
        async fetchWithTimeout(url) {'''
          new = '''        VOICEVOX_SYNTHESIS_TIMEOUT_MS: 60000,
        async readJsonResponseWithLimit(response) { return response.json(); },
        async readBlobResponseWithLimit(response) { return response.blob(); },
        async fetchWithTimeout(url) {'''
          if old not in source:
              raise SystemExit('性能テストの補正対象が見つかりません')
          path.write_text(source.replace(old, new, 1))
          PY

          git diff --binary --full-index 56a461377fab9d49cb8d69c070e766304ee05c81 > /tmp/final-main.patch
          test -s /tmp/final-main.patch
          git reset --hard 56a461377fab9d49cb8d69c070e766304ee05c81
          git clean -fdx
          git apply --check /tmp/final-main.patch
          git apply /tmp/final-main.patch

      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Run full regression and security checks
        shell: bash
        run: |
          for f in *.js tests/*.js tools/*.mjs; do node --check "$f"; done
          node tools/test-reading-performance.mjs
          for t in tests/*.test.js; do node "$t"; done
          node tools/security-audit.mjs
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const refs = [m.background.service_worker, m.options_page, ...Object.values(m.icons),
            ...m.content_scripts.flatMap((c) => c.js),
            ...(m.web_accessible_resources || []).flatMap((w) => w.resources || [])];
          for (const ref of refs) if (!fs.existsSync(ref)) throw new Error(`Missing manifest reference: ${ref}`);
          console.log('manifest references: PASSED');
          NODE

      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

      - name: Commit clean audited result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 全体監査で検出した不具合と脆弱性を修正 [skip ci]"
          git push --force origin HEAD:audit/full-codebase
