name: apply-final-audit

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  security-events: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: audit/full-codebase
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Apply final audited tree
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          cat .audit-patch/part* > /tmp/audit-final.patch.gz.b64
          base64 -d /tmp/audit-final.patch.gz.b64 | gzip -d > /tmp/audit-final.patch
          git reset --hard 1472cc49db030043c5961ed8b209ae263b87ddb9
          git clean -fdx
          git apply --check /tmp/audit-final.patch
          git apply /tmp/audit-final.patch
          echo "EXPECTED_REMOTE_SHA=$expected" >> "$GITHUB_ENV"

      - uses: github/codeql-action/init@v4.36.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Run audit regression suite
        shell: bash
        run: |
          for f in *.js tests/*.js tools/*.mjs; do
            node --check "$f"
          done
          for t in tests/*.test.js; do
            node "$t"
          done
          node tools/security-audit.mjs

      - uses: github/codeql-action/analyze@v4.36.0

      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 全体監査で検出した不具合と脆弱性を修正"
          git push --force-with-lease=refs/heads/audit/full-codebase:${EXPECTED_REMOTE_SHA} origin HEAD:audit/full-codebase
