name: audit-export

on:
  push:
    branches: ["audit/full-codebase"]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source snapshot
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 1
