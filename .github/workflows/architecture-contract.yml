name: architecture-contract

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: バックグラウンド状態遷移の契約検査
        run: node tests/background-state-contract.test.js

      - name: Content Scriptライフサイクルの契約検査
        run: node tests/content-lifecycle.test.js

      - name: Content Scriptプライバシー境界の契約検査
        run: node tests/content-privacy.test.js

      - name: Content Script注入順と無効化境界の契約検査
        run: node tests/context-invalidation.test.js

      - name: OCR Canvas readbackの契約検査
        run: node tests/ocr-canvas-readback.test.js

      - name: バックグラウンド分割ソースと互換バンドルの一致確認
        run: node tools/sync-background-bundle.mjs --check

      - name: Offscreen分割ソースと互換バンドルの一致確認
        run: node tools/sync-offscreen-bundle.mjs --check
