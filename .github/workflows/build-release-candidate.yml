name: build-release-candidate

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Chrome Web Store package
        shell: pwsh
        run: ./tools/pack.ps1

      # zip 名は pack.ps1 が manifest.json の version から決めるため、ここでも同じ値を読む
      # （版上げのたびにこのファイルを直す必要をなくす）。
      - name: Read extension version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-reader-for-voicevox-${{ steps.version.outputs.value }}-rc
          path: dist/web-reader-for-voicevox-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 14
