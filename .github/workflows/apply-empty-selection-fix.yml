name: apply-empty-selection-fix

on:
  push:
    branches:
      - fix/expected-empty-selection-warning

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/expected-empty-selection-warning
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Remove expected-user-action warning and add regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('content.js')
          source = path.read_text(encoding='utf-8')
          target = '            console.warn("Web Reader for VOICEVOX: 読み上げるテキストが選択されていません。(ショートカット)");\n'
          if source.count(target) != 1:
              raise SystemExit('対象の警告行が一意に見つかりません')
          path.write_text(source.replace(target, '', 1), encoding='utf-8')
          PY

          cat > tests/expected-user-actions.test.js <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const source = fs.readFileSync(path.join(__dirname, '..', 'content.js'), 'utf8');
          const start = source.indexOf('    toggleReading() {');
          const end = source.indexOf('\n    // TOGGLE_READING', start);
          assert.ok(start >= 0 && end > start, 'toggleReading の実装が見つかる');

          const body = source.slice(start, end);
          assert.match(body, /this\.updateUIState\(['"]error['"]\)/,
            '未選択時のページ内エラー表示を維持する');
          assert.doesNotMatch(body, /console\.(?:warn|error)\s*\(/,
            'テキスト未選択は想定内操作のため拡張機能エラーへ記録しない');

          console.log('expected user actions: PASSED');
          JS

      - name: Verify
        run: |
          node --check content.js
          node --check tests/expected-user-actions.test.js
          node tests/expected-user-actions.test.js

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js tests/expected-user-actions.test.js
          git diff --cached --check
          git commit -m "fix: 未選択時の想定内警告をエラー一覧へ残さない [skip ci]"
          git push origin HEAD:fix/expected-empty-selection-warning
